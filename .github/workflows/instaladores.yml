name: Instaladores

# criar uma tag v2.7.0 (ou rodar na mao pela aba Actions) gera os instaladores da versao em rust (tauri)
# para mac e windows e publica tudo numa Release do GitHub, pronto pra baixar.
# os nomes dos arquivos nao mudam de versao para versao: os links do README apontam para releases/latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # o esquema do rust tem que estar igual ao do banco.js
      - run: node scripts/esquema-para-rust.js && git diff --exit-code src-tauri/esquema.json
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Monta para Mac com chip Apple e Mac Intel
        run: |
          mkdir -p saida
          for alvo in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x64; do
            t="${alvo%%:*}"; nome="${alvo##*:}"
            npx tauri build --target "$t" --bundles app,dmg
            cp src-tauri/target/$t/release/bundle/dmg/*.dmg "saida/Syvo-mac-$nome.dmg"
            ditto -c -k --keepParent "src-tauri/target/$t/release/bundle/macos/Syvo.app" "saida/Syvo-mac-$nome.zip"
          done
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-mac
          path: saida/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles nsis
      - name: Junta o instalador e o portatil
        shell: bash
        run: |
          mkdir -p saida
          cp src-tauri/target/release/bundle/nsis/*.exe saida/Syvo-win-x64.exe
          # o portatil e o proprio exe: com "portable" no nome, os dados ficam na pasta Syvo-dados ao lado dele
          cp src-tauri/target/release/syvo.exe saida/Syvo-win-x64-portable.exe
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: saida/*
          if-no-files-found: error

  publicar:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" instaladores/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Syvo $GITHUB_REF_NAME" \
            --notes "Versão em Rust (Tauri): instaladores de poucos MB. Baixe o .dmg no Mac ou o .exe no Windows; a versão portátil é o .zip no Mac e o -portable.exe no Windows. Seus dados continuam: o app novo abre o mesmo arquivo do anterior. Veja o README para abrir o app na primeira vez."
